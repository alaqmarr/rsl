# ------------------------------------------------------------------------------
# 7. Isolated Internal Listeners (Ports 4580–4582)
# ------------------------------------------------------------------------------
server {
    listen 127.0.0.1:4580;
    server_name _;
    client_max_body_size 50M;
    location / {
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rsl_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $rsl_forwarded_proto;
    }
}

server {
    listen 127.0.0.1:4581;
    server_name _;
    client_max_body_size 15M;
    location / {
        proxy_pass http://127.0.0.1:4501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $rsl_forwarded_proto;
    }
}

server {
    listen 127.0.0.1:4582;
    server_name _;
    location / {
        proxy_pass http://127.0.0.1:4502;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $rsl_forwarded_proto;
    }
}

# ------------------------------------------------------------------------------
# 8. Auto-Provisioned Per-Client SNI Certificates (<slug>.tally & <slug>.api)
# ------------------------------------------------------------------------------
include /etc/nginx/rsl-clients-ssl/*.conf;
