# ==============================================================================
# RSL Marketing Nginx Config — Shared-Server Safe (Coexists with Existing Sites)
# ==============================================================================
# SAFETY GUARANTEES FOR SHARED NGINX SERVERS:
# 1. ZERO `default_server` and ZERO `_` catch-all on ports 80/443 — existing sites
#    on this server (including rapidshiftlabs.in / www.rapidshiftlabs.in or other
#    domains) are 100% untouched.
# 2. Matches ONLY explicit platform subdomains:
#      - setup.rapidshiftlabs.in (Dedicated First-Run Super Admin & Setup Module)
#      - app.rapidshiftlabs.in   (Customer Business Dashboard)
#      - admin.rapidshiftlabs.in (Staff Operations Console)
#      - docs.rapidshiftlabs.in  (Public Help & API Reference)
#      - tally.rapidshiftlabs.in & *.tally.rapidshiftlabs.in (Tally Sync Ingress)
#      - api.rapidshiftlabs.in   & *.api.rapidshiftlabs.in   (Client Public API)
# 3. Serves Let's Encrypt HTTP-01 challenges via /var/www/rsl-acme so both base
#    subdomains and per-client subdomains (<client>.tally / <client>.api) obtain
#    and auto-renew SSL certificates automatically on GoDaddy DNS without API keys.

map $http_upgrade $rsl_connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $rsl_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# ------------------------------------------------------------------------------
# 1. Port 80: ACME HTTP-01 Challenge Webroot + HTTPS Redirect (RSL Subdomains Only)
# ------------------------------------------------------------------------------
server {
    listen 80;
    # __IPV6_LISTEN_80__
    server_name setup.rapidshiftlabs.in app.rapidshiftlabs.in admin.rapidshiftlabs.in docs.rapidshiftlabs.in tally.rapidshiftlabs.in *.tally.rapidshiftlabs.in api.rapidshiftlabs.in *.api.rapidshiftlabs.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rsl-acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Port 443: Dedicated Platform Setup Wizard (setup.rapidshiftlabs.in -> 4501)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    # __IPV6_LISTEN_443__
    server_name setup.rapidshiftlabs.in;

    ssl_certificate     /etc/ssl/rsl/setup.crt;
    ssl_certificate_key /etc/ssl/rsl/setup.key;

    client_max_body_size 15M;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = / {
        rewrite ^ /setup break;
        proxy_pass http://127.0.0.1:4501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:4501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rsl_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ------------------------------------------------------------------------------
# 3. Port 443: Customer App (app.rapidshiftlabs.in -> 127.0.0.1:4500)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    # __IPV6_LISTEN_443__
    server_name app.rapidshiftlabs.in;

    ssl_certificate     /etc/ssl/rsl/app.crt;
    ssl_certificate_key /etc/ssl/rsl/app.key;

    client_max_body_size 50M;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rsl_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}

# ------------------------------------------------------------------------------
# 4. Port 443: Staff Admin Console (admin.rapidshiftlabs.in -> 127.0.0.1:4501)
